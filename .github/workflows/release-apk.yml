name: Release APK

# Builds a release APK on a clean runner and attaches it to a GitHub Release,
# which is what the README's "📱 Download APK" link points at.
#
# Two ways to trigger this:
#   1. Manually  -> Actions tab -> "Release APK" -> Run workflow
#   2. Push a tag -> `git tag v1.0.0 && git push origin v1.0.0`
#
# The Release is created with the workflow's own GITHUB_TOKEN, so no personal
# access token needs to be stored. The runner also accepts the preinstalled
# Android SDK licences so an unattended build works on a clean machine.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      apk_path:
        description: 'Optional: path to a prebuilt APK to attach instead of building'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-apk:
    name: Build & publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pin the Flutter version. `channel: stable` floats, and a newer stable
      # (3.47.x) requires Gradle >= 8.14.0 while this project pins 8.10.2 —
      # so the tag build broke the moment Flutter shipped a release.
      # 3.32.4 is the version this project is developed and verified against.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: stable
          cache: true
      # The Android SDK ships with the ubuntu-latest image, but the licences
      # must be accepted before Gradle will resolve the platform it needs.
      - name: Accept Android licences
        run: yes | flutter doctor --android-licenses || true
      - name: Verify toolchain
        run: flutter doctor -v
      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release
      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi
      # The asset keeps its build name, `app-release.apk`. The README links
      # straight to /releases/download/<tag>/app-release.apk so the click is a
      # direct download rather than a trip through the release web page —
      # renaming the asset here would break that link.
      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "NIRVANA ${{ steps.meta.outputs.tag }} — Android APK"
          body_path: RELEASE_NOTES.md
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
