name: Deploy Live Demo (Flutter Web → GitHub Pages)

# Publishes the NIRVANA prototype as a live Web demo at
# https://abhinav-s-biju.github.io/S_I_H/
#
# The bundle is committed to this repo under `web_demo/` and published to the
# `gh-pages` branch. Committing the built bundle (rather than compiling it on
# the runner) keeps the demo independent of the CI Flutter toolchain, so a
# dependency-resolution hiccup on a fresh runner can never take the demo down.
# Re-generate `web_demo/` locally with:  .\build_web.bat  then copy build\web
on:
  push:
    branches: [main]
    paths:
      - 'web_demo/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: write
# Only one deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    name: Publish web_demo/ to gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Sanity-check the committed bundle
        run: |
          set -e
          test -f web_demo/index.html
          test -f web_demo/main.dart.js
          echo "Bundle looks complete:"
          ls -la web_demo | head -20
      - name: Add Pages safety files
        run: |
          # GitHub Pages has no server-side rewrite, so a deep link such as
          # /S_I_H/caregiver/dashboard would 404 on a hard refresh.
          # 404.html mirrors index.html and the app router resolves the path.
          cp web_demo/index.html web_demo/404.html
          # Skip Jekyll so underscore-prefixed asset dirs are not stripped.
          touch web_demo/.nojekyll
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web_demo
          publish_branch: gh-pages
          # Replace the branch contents each time so stale chunks never linger.
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy NIRVANA live demo'
